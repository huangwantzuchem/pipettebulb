<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>吸量管＋安全吸球＋燒杯｜操作模擬</title>
<style>
  :root{
    --bg:#f4f8fb;
    --panel:#ffffff;
    --line:#c9d7e2;
    --ink:#183247;
    --muted:#5f7485;
    --blue:#219ebc;
    --blue2:#8ecae6;
    --danger:#e63946;
    --shadow:0 5px 18px rgba(31,65,87,.10);
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}
  body{
    font-family:Arial,"Noto Sans TC","Microsoft JhengHei",sans-serif;
    overflow-x:hidden;
  }
  .app{
    width:100%;
    max-width:1500px;
    margin:0 auto;
    padding:12px;
  }
  .grid{
    display:grid;
    grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    grid-template-rows:minmax(440px,58vh) minmax(300px,42vh);
    gap:12px;
    min-height:calc(100vh - 24px);
  }
  .panel{
    min-width:0;
    min-height:0;
    overflow:hidden;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:var(--shadow);
    position:relative;
    display:flex;
    flex-direction:column;
  }
  .panel h2{
    flex:0 0 auto;
    margin:0;
    padding:13px 16px 9px;
    text-align:center;
    font-size:clamp(17px,2vw,22px);
    line-height:1.2;
    font-weight:700;
    color:#17384e;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #e4edf3;
    z-index:2;
  }
  .stage{
    flex:1 1 auto;
    min-height:0;
    min-width:0;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:8px;
    overflow:hidden;
    position:relative;
  }
  canvas{
    display:block;
    width:100%;
    height:100%;
    max-width:100%;
    max-height:100%;
    /* 允許手機雙指縮放頁面；按鈕操作仍由 Pointer Events 處理 */
    touch-action: manipulation;
  }
  .controls{
    width:min(92%,460px);
    margin:auto;
    display:flex;
    flex-direction:column;
    gap:12px;
    justify-content:center;
    align-items:stretch;
    min-height:0;
  }
  .op-btn{
    border:1px solid #a9c4d4;
    border-radius:14px;
    background:linear-gradient(#fff,#eef7fb);
    color:#17435c;
    box-shadow:0 4px 0 #bfd2de,0 7px 15px rgba(41,92,119,.10);
    padding:14px 18px;
    min-height:64px;
    font-size:clamp(16px,2vw,21px);
    font-weight:700;
    cursor:pointer;
    user-select:none;
    -webkit-user-select:none;
    -moz-user-select:none;
    -ms-user-select:none;
    -webkit-touch-callout:none;
    touch-action:none;
    transition:transform .06s ease,background .08s ease,box-shadow .08s ease;
  }
  .op-btn, .op-btn *{
    user-select:none !important;
    -webkit-user-select:none !important;
    -moz-user-select:none !important;
    -ms-user-select:none !important;
    -webkit-touch-callout:none !important;
  }
  .op-btn *,
  .controls,
  .controls *{
    user-select:none !important;
    -webkit-user-select:none !important;
    -webkit-touch-callout:none !important;
  }
  .op-btn .key{
    display:inline-flex;
    width:38px;height:38px;
    align-items:center;justify-content:center;
    margin-right:9px;
    border-radius:50%;
    background:#d9f1fa;
    color:#09678a;
    border:1px solid #91c5d9;
  }
  .op-btn.pressed{
    transform:translateY(4px);
    background:#b9e7f5;
    box-shadow:0 1px 0 #7daec2,0 3px 8px rgba(41,92,119,.14);
  }
  .volume-wrap{
    width:100%;
    display:flex;
    flex:1 1 auto;
    min-height:0;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    gap:18px;
    padding:14px;
    overflow:hidden;
  }
  .volume-value{
    font-size:clamp(48px,7vw,88px);
    line-height:1;
    font-weight:800;
    letter-spacing:.02em;
    text-align:center;
    color:#176a89;
    white-space:nowrap;
  }
  .volume-value.warn{color:var(--danger)}
  .warning{
    width:min(90%,560px);
    min-height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:10px 14px;
    border-radius:12px;
    color:#a20d19;
    background:#fff0f1;
    border:1px solid #ef9ba2;
    font-size:clamp(14px,2vw,19px);
    font-weight:700;
    text-align:center;
  }
  .warning.hidden{visibility:hidden}
  .legend{
    color:var(--muted);
    text-align:center;
    font-size:13px;
    max-width:620px;
    width:100%;
    line-height:1.45;
  }

  @media (max-width:900px) and (orientation:portrait){
    .grid{
      grid-template-columns:1fr;
      grid-template-rows:minmax(430px,60vh) minmax(360px,52vh) minmax(360px,48vh) minmax(280px,38vh);
      min-height:auto;
    }
    .app{padding:8px}
  }
  @media (max-width:900px) and (orientation:landscape){
    .grid{
      grid-template-columns:minmax(0,1fr) minmax(0,1fr);
      grid-template-rows:minmax(330px,56vh) minmax(240px,44vh);
      min-height:calc(100vh - 16px);
    }
    .app{padding:8px}
    .op-btn{min-height:52px;padding:9px 12px}
    .controls{gap:8px}
  }
  @media (max-width:520px){
    .panel{border-radius:12px}
    .panel h2{padding:11px 10px 8px}
    .stage{padding:4px}
    .op-btn{min-height:58px}
  }
</style>
</head>
<body>
<div class="app">
  <main class="grid">
    <section class="panel" id="panel1">
      <h2>裝置 / 吸量管＋安全吸球＋燒杯</h2>
      <div class="stage">
        <canvas id="mainCanvas" aria-label="吸量管、安全吸球與燒杯主視圖"></canvas>
      </div>
    </section>

    <section class="panel" id="panel2">
      <h2>安全吸球放大圖</h2>
      <div class="stage">
        <canvas id="bulbCanvas" aria-label="安全吸球放大圖"></canvas>
      </div>
    </section>

    <section class="panel" id="panel3">
      <h2>安全吸球操作按鈕</h2>
      <div class="stage">
        <div class="controls">
          <button class="op-btn" type="button" data-action="A">
            <span class="key">A</span>let out Air
          </button>
          <button class="op-btn" type="button" data-action="S">
            <span class="key">S</span>Suck in liquid
          </button>
          <button class="op-btn" type="button" data-action="E">
            <span class="key">E</span>Empty the pipette
          </button>
        </div>
      </div>
    </section>

    <section class="panel" id="panel4">
      <h2>吸量管內液體體積</h2>
      <div class="volume-wrap">
        <div id="volumeValue" class="volume-value">0.0 mL</div>
        <div id="warning" class="warning hidden">⚠ 液面已超過 0 mL 刻度！</div>
        <div class="legend">吸量管容量：25 mL</div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";

/* =========================================================
   核心狀態
   ========================================================= */
const state = {
  bulbDeflation: 0.0,
  pipetteVolume: 0.0,
  beakerVolume: 100.0,
  isAPressed: false,
  isSPressed: false,
  isEPressed: false,

  /* S/E 同時按下時，以先按下者為優先 */
  activeAction: null,
  actionOrder: 0,
  pressedOrder: {A:0,S:0,E:0},

  /* 平滑顯示用值；真實狀態仍以核心狀態為準 */
  displayVolume: 0.0,
  displayBulbDeflation: 0.0
};

/* =========================================================
   可調參數
   ========================================================= */
const CONFIG = {
  SUCK_RATE: 5.0,             // mL/s
  EMPTY_RATE: 5.0,            // mL/s
  BULB_DEFLATE_RATE: 1 / 3,   // 約 3 秒由 0 → 1
  MAX_PIPETTE_VOLUME: 35.0,
  WARNING_ON: 25.5,
  WARNING_OFF: 25.0,
  BEAKER_INITIAL: 100.0,
  BULB_SMOOTH: 12.0,
  VOLUME_SMOOTH: 14.0
};

/* =========================================================
   DOM
   ========================================================= */
const mainCanvas = document.getElementById("mainCanvas");
const bulbCanvas = document.getElementById("bulbCanvas");
const mainCtx = mainCanvas.getContext("2d");
const bulbCtx = bulbCanvas.getContext("2d");
const volumeEl = document.getElementById("volumeValue");
const warningEl = document.getElementById("warning");
const actionButtons = [...document.querySelectorAll(".op-btn")];

/* =========================================================
   共用繪圖工具
   ========================================================= */
function clamp(v, min, max) {
  return Math.max(min, Math.min(max, v));
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function easeToward(current, target, speed, dt) {
  const t = 1 - Math.exp(-speed * dt);
  return lerp(current, target, t);
}

function drawTextCentered(ctx, text, x, y, size, color, weight="400") {
  ctx.save();
  ctx.font = `${weight} ${size}px Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.restore();
}

function drawBadge(ctx, x, y, r, label, pressed, scale=1) {
  ctx.save();
  ctx.beginPath();
  ctx.arc(x, y, r, 0, Math.PI * 2);

  const g = ctx.createLinearGradient(x-r,y-r,x+r,y+r);
  if (pressed) {
    g.addColorStop(0, "#d8f8ff");
    g.addColorStop(1, "#69c7ea");
  } else {
    g.addColorStop(0, "#eefbff");
    g.addColorStop(1, "#bceaff");
  }
  ctx.fillStyle = g;
  ctx.fill();

  ctx.lineWidth = 3 * scale;
  ctx.strokeStyle = pressed ? "#0b79a0" : "#0759bb";
  ctx.stroke();

  drawTextCentered(ctx, label, x, y+1*scale, 31*scale, "#083e99", "700");
  ctx.restore();
}

function drawWarningGlow(ctx, x, y, radius, time) {
  const pulse = 0.45 + 0.35 * Math.sin(time * 7);
  ctx.save();
  ctx.globalAlpha = pulse;
  ctx.shadowColor = "#e63946";
  ctx.shadowBlur = 28;
  ctx.fillStyle = "#e63946";
  ctx.beginPath();
  ctx.arc(x, y, radius, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function blueGrad(ctx,x1,y1,x2,y2){
  const g=ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0,"#72cfff");
  g.addColorStop(.45,"#168ef1");
  g.addColorStop(1,"#0067d8");
  return g;
}

/* =========================================================
   drawBeaker(ctx, x, y, scale, state)
   幾何沿用上一階段 SVG
   ========================================================= */
function drawBeaker(ctx, x, y, scale, s) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);

  const bodyPath = new Path2D();
  bodyPath.moveTo(305,1035);
  bodyPath.quadraticCurveTo(315,1010,350,1005);
  bodyPath.lineTo(735,1005);
  bodyPath.quadraticCurveTo(770,1010,780,1035);
  bodyPath.lineTo(748,1450);
  bodyPath.quadraticCurveTo(744,1492,700,1500);
  bodyPath.lineTo(385,1500);
  bodyPath.quadraticCurveTo(341,1492,337,1450);
  bodyPath.closePath();

  /* 玻璃本體 */
  const glass = ctx.createLinearGradient(305,0,780,0);
  glass.addColorStop(0,"rgba(191,234,255,.52)");
  glass.addColorStop(.18,"rgba(255,255,255,.20)");
  glass.addColorStop(.55,"rgba(217,245,255,.10)");
  glass.addColorStop(.82,"rgba(255,255,255,.35)");
  glass.addColorStop(1,"rgba(117,201,255,.48)");
  ctx.fillStyle = glass;
  ctx.fill(bodyPath);
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0877d9";
  ctx.stroke(bodyPath);

  /*
    100 mL 液面：與上一階段 SVG 的 1135 座標對齊。
    0 mL → 1450；100 mL → 1135。
  */
  const liquidTop = 1135 + (100 - clamp(s.beakerVolume,0,100)) * 3.15;

  ctx.save();
  ctx.clip(bodyPath);

  const liquid = ctx.createLinearGradient(0,liquidTop,0,1500);
  liquid.addColorStop(0,"rgba(142,202,230,.72)");
  liquid.addColorStop(1,"rgba(33,158,188,.28)");
  ctx.fillStyle = liquid;
  ctx.fillRect(300,liquidTop,490,950);

  /* 下彎彎月面，最低點對應液面 */
  ctx.beginPath();
  ctx.moveTo(327,liquidTop);
  ctx.quadraticCurveTo(542,liquidTop+19,758,liquidTop);
  ctx.lineWidth = 5;
  ctx.strokeStyle = "#279fe3";
  ctx.stroke();
  ctx.restore();

  /* 杯緣 */
  ctx.beginPath();
  ctx.moveTo(310,1032);
  ctx.bezierCurveTo(350,995,715,995,775,1032);
  ctx.bezierCurveTo(718,1060,365,1060,310,1032);
  ctx.closePath();
  ctx.fillStyle = "rgba(234,250,255,.62)";
  ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0877d9";
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(333,1030);
  ctx.bezierCurveTo(390,1012,690,1012,753,1030);
  ctx.bezierCurveTo(688,1045,395,1045,333,1030);
  ctx.closePath();
  ctx.fillStyle = "rgba(255,255,255,.45)";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#55bdf5";
  ctx.stroke();

  /* 燒杯刻度與數字：沿用上一階段較細版本 */
  ctx.save();
  ctx.strokeStyle = "#0753a7";
  ctx.fillStyle = "#0753a7";
  ctx.lineWidth = 2.2;
  ctx.font = '400 27px Arial,"Noto Sans TC",sans-serif';
  ctx.textBaseline = "alphabetic";

  const marks = [
    [1135,45,"100"],[1210,33,"80"],[1285,45,"60"],
    [1360,33,"40"],[1435,45,"20"]
  ];
  for (const [yy,len,label] of marks) {
    ctx.beginPath();
    ctx.moveTo(690-len,yy);
    ctx.lineTo(690,yy);
    ctx.stroke();
    ctx.fillText(label,698,yy+9);
  }

  ctx.font = '400 14px Arial,"Noto Sans TC",sans-serif';
  ctx.fillText("APPROX",690,1170);
  ctx.font = '400 25px Arial,"Noto Sans TC",sans-serif';
  ctx.fillText("100 mL",405,1430);
  ctx.restore();

  ctx.restore();
}

/* =========================================================
   drawPipette(ctx, x, y, scale, state)
   幾何沿用上一階段 SVG
   ========================================================= */
function drawPipette(ctx, x, y, scale, s) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  const tube = new Path2D();
  tube.moveTo(500,460);
  tube.lineTo(580,460);
  tube.lineTo(580,1260);
  tube.bezierCurveTo(580,1280,568,1300,552,1319);
  tube.lineTo(542,1330);
  tube.lineTo(532,1319);
  tube.bezierCurveTo(516,1300,500,1280,500,1260);
  tube.closePath();

  /* 0 mL = 尖端，25 mL = 0 刻度 */
  const tipY = 1330;
  const topY = 660;
  const yLiquid = tipY - (s.pipetteVolume / 25) * (tipY-topY);

  /* 管內液體 */
  ctx.save();
  ctx.clip(tube);
  const liquid = ctx.createLinearGradient(0,yLiquid,0,1400);
  liquid.addColorStop(0,"rgba(142,202,230,.76)");
  liquid.addColorStop(1,"rgba(33,158,188,.40)");
  ctx.fillStyle = liquid;
  ctx.fillRect(490,yLiquid,110,880);

  ctx.beginPath();
  ctx.moveTo(500,yLiquid);
  ctx.quadraticCurveTo(540,yLiquid+11,580,yLiquid);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#219ebc";
  ctx.stroke();
  ctx.restore();

  /* 玻璃管 */
  const glass = ctx.createLinearGradient(500,0,580,0);
  glass.addColorStop(0,"rgba(191,234,255,.52)");
  glass.addColorStop(.18,"rgba(255,255,255,.20)");
  glass.addColorStop(.55,"rgba(217,245,255,.10)");
  glass.addColorStop(.82,"rgba(255,255,255,.35)");
  glass.addColorStop(1,"rgba(117,201,255,.48)");
  ctx.fillStyle = glass;
  ctx.fill(tube);
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#168bd8";
  ctx.stroke(tube);

  /* 再畫一次液面，使彎月面保持清楚 */
  ctx.save();
  ctx.clip(tube);
  ctx.beginPath();
  ctx.moveTo(500,yLiquid);
  ctx.quadraticCurveTo(540,yLiquid+11,580,yLiquid);
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#219ebc";
  ctx.stroke();
  ctx.restore();

  /* 刻度 0～24 */
  ctx.save();
  ctx.strokeStyle = "#172b3b";
  ctx.fillStyle = "#172b3b";
  ctx.lineWidth = 1.8;
  ctx.textAlign = "left";
  ctx.textBaseline = "alphabetic";
  ctx.font = '400 22px Arial,"Noto Sans TC",sans-serif';
  ctx.fillText("mL",514,640);

  for(let i=0;i<=24;i++){
    const yy = 660 + i*25;
    ctx.beginPath();
    ctx.moveTo(505,yy);
    ctx.lineTo(523,yy);
    ctx.stroke();
    ctx.font = '400 18px Arial,"Noto Sans TC",sans-serif';
    ctx.fillText(String(i), i<10 ? 536 : 530, yy+6);
  }
  ctx.restore();

  ctx.restore();
}

/* =========================================================
   drawBulb(ctx, x, y, scale, state)
   區域 1 與區域 2 共用完全相同的函式
   ========================================================= */
function drawBulb(ctx, x, y, scale, s) {
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(scale,scale);

  /*
    主球體為左右、上下對稱的橢圓。
    只做水平方向壓縮；面積 = πab，垂直半徑不變，
    因此 a → a/sqrt(2) 時體積約減半。
  */
  const sx = lerp(1,Math.SQRT1_2,clamp(s.displayBulbDeflation,0,1));

  /*
    主球體：嚴格使用「幾何對稱橢圓」。

    未壓縮時：
      中心 = (540, 218)
      水平半徑 = 125
      垂直半徑 = 128
      外框 = x 415～665、y 90～346

    因此左右、上下皆以同一中心軸完全對稱。
    A 壓扁 / S 回彈時只縮放 X 軸，
    Y 軸尺寸與中心位置完全不變。
  */
  const bodyCx = 540;
  const bodyCy = 218;
  const bodyRx = 125;
  const bodyRy = 128;

  ctx.save();

  ctx.translate(bodyCx, bodyCy);
  ctx.scale(sx, 1);

  const blue =
    ctx.createRadialGradient(
      -55,
      -73,
      12,
      70,
      68,
      250
    );

  blue.addColorStop(
    0,
    "#8bdcff"
  );

  blue.addColorStop(
    .30,
    "#35a9ff"
  );

  blue.addColorStop(
    1,
    "#0875dc"
  );

  /*
    唯一的主球體輪廓：
    不再使用任何不對稱 Bezier 路徑。
  */
  ctx.beginPath();

  ctx.ellipse(
    0,
    0,
    bodyRx,
    bodyRy,
    0,
    0,
    Math.PI * 2
  );

  ctx.fillStyle = blue;
  ctx.fill();

  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0068d8";
  ctx.stroke();

  /*
    白色高光僅作為表面反光，
    不參與主球體輪廓，因此不會改變橢圓球的幾何對稱性。
  */
  ctx.save();

  ctx.globalAlpha = .82;

  ctx.beginPath();

  ctx.ellipse(
    -63,
    -52,
    18,
    46,
    0.18,
    0,
    Math.PI * 2
  );

  ctx.fillStyle =
    "rgba(255,255,255,1)";

  ctx.fill();

  ctx.restore();

  ctx.restore();

  /* 頂端短管 */
  const top = new Path2D();
  top.moveTo(505,18);
  top.quadraticCurveTo(505,7,540,7);
  top.quadraticCurveTo(575,7,575,18);
  top.lineTo(570,90);
  top.lineTo(510,90);
  top.closePath();

  ctx.fillStyle = blueGrad(ctx,505,0,575,0);
  ctx.fill(top);
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0068d8";
  ctx.stroke(top);

  /* 頂端開口 */
  ctx.beginPath();
  ctx.ellipse(540,18,42,13,0,0,Math.PI*2);
  ctx.fillStyle = "#63c8ff";
  ctx.fill();
  ctx.lineWidth = 6;
  ctx.strokeStyle = "#005bc9";
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(540,18,27,6,0,0,Math.PI*2);
  ctx.fillStyle = "#e5f8ff";
  ctx.fill();
  ctx.lineWidth = 3;
  ctx.strokeStyle = "#118ee7";
  ctx.stroke();

  /* S 短頸 */
  const neck = new Path2D();
  neck.rect(500,346,80,114);
  ctx.fillStyle = blueGrad(ctx,500,0,580,0);
  ctx.fill(neck);
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0068d8";
  ctx.stroke(neck);

  /* 側邊支管 */
  const branch = new Path2D();
  branch.moveTo(500,382);
  branch.lineTo(390,382);
  branch.bezierCurveTo(377,354,345,342,316,352);
  branch.bezierCurveTo(285,362,268,389,272,420);
  branch.bezierCurveTo(276,451,301,472,332,474);
  branch.bezierCurveTo(360,476,384,459,394,432);
  branch.lineTo(500,432);
  branch.closePath();
  ctx.fillStyle = blueGrad(ctx,260,340,500,470);
  ctx.fill(branch);
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0068d8";
  ctx.stroke(branch);

  /* 側邊開口 */
  ctx.beginPath();
  ctx.moveTo(276,372);
  ctx.quadraticCurveTo(260,372,260,412);
  ctx.quadraticCurveTo(260,452,276,452);
  ctx.fillStyle = "#bcecff";
  ctx.fill();
  ctx.lineWidth = 7;
  ctx.strokeStyle = "#0058b8";
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(276,412,9,38,0,0,Math.PI*2);
  ctx.fillStyle = "#0c65bc";
  ctx.fill();
  ctx.lineWidth = 4;
  ctx.strokeStyle = "#003f91";
  ctx.stroke();

  /* A/S/E 三個按鈕 */
  drawBadge(ctx,540,70,29,"A",s.isAPressed,1);
  drawBadge(ctx,540,390,27,"S",s.isSPressed,1);
  drawBadge(ctx,445,407,25,"E",s.isEPressed,1);

  /* A 按壓提示 */
  if (s.isAPressed) {
    ctx.save();
    ctx.globalAlpha = .9;
    ctx.strokeStyle = "#ffffff";
    ctx.fillStyle = "#ffffff";
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(600,125);
    ctx.lineTo(570,155);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(570,155);
    ctx.lineTo(572,139);
    ctx.lineTo(586,153);
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  if (s.pipetteVolume > CONFIG.WARNING_ON) {
    drawWarningGlow(ctx,445,407,31,performance.now()/1000);
  }

  ctx.restore();
}

/* =========================================================
   主視圖
   ========================================================= */
function drawMain() {
  const rect = mainCanvas.getBoundingClientRect();
  const w = Math.max(1,rect.width);
  const h = Math.max(1,rect.height);
  const dpr = Math.min(window.devicePixelRatio || 1,2);

  mainCanvas.width = Math.round(w*dpr);
  mainCanvas.height = Math.round(h*dpr);
  mainCtx.setTransform(dpr,0,0,dpr,0,0);
  mainCtx.clearRect(0,0,w,h);

  /* 保留上一階段 SVG 1024×1536 比例，置中且不超出區域 */
  const scale = Math.min(w/1024,h/1536);
  const ox = (w-1024*scale)/2;
  const oy = (h-1536*scale)/2;

  drawBeaker(mainCtx,ox,oy,scale,state);
  drawPipette(mainCtx,ox,oy,scale,state);
  drawBulb(mainCtx,ox,oy,scale,state);
}

/* =========================================================
   安全吸球放大圖
   ========================================================= */
function drawBulbStage() {
  const rect = bulbCanvas.getBoundingClientRect();
  const w = Math.max(1,rect.width);
  const h = Math.max(1,rect.height);
  const dpr = Math.min(window.devicePixelRatio || 1,2);

  bulbCanvas.width = Math.round(w*dpr);
  bulbCanvas.height = Math.round(h*dpr);
  bulbCtx.setTransform(dpr,0,0,dpr,0,0);
  bulbCtx.clearRect(0,0,w,h);

  /*
    ⚠ 待確認：放大圖約佔區域 2 的 70% 寬度。
    同時以高度限制，保證所有元件都在區域內。
  */
  const baseW = 405;
  const scale = Math.min((w*0.70)/baseW,(h*0.82)/474);
  const actualW = 405*scale;
  const actualH = 467*scale;
  const x = (w-actualW)/2 - 260*scale;
  const y = (h-actualH)/2 - 7*scale;

  drawBulb(bulbCtx,x,y,scale,state);
}

/* =========================================================
   體積顯示
   ========================================================= */
function updateReadout() {
  volumeEl.textContent = `${state.displayVolume.toFixed(1)} mL`;

  const over = state.pipetteVolume > CONFIG.WARNING_ON;
  volumeEl.classList.toggle("warn",over);
  warningEl.classList.toggle("hidden",!over);
}

/* =========================================================
   三處按鈕同步高亮
   ========================================================= */
function updateButtons() {
  actionButtons.forEach(btn=>{
    const key = btn.dataset.action;
    const pressed =
      key==="A" ? state.isAPressed :
      key==="S" ? state.isSPressed :
      state.isEPressed;
    btn.classList.toggle("pressed",pressed);
    btn.setAttribute("aria-pressed",pressed ? "true" : "false");
  });
}

/* =========================================================
   按下 / 放開
   ========================================================= */
function pressAction(action) {
  if (!["A","S","E"].includes(action)) return;

  const already =
    action==="A" ? state.isAPressed :
    action==="S" ? state.isSPressed :
    state.isEPressed;

  if (already) return;

  state.actionOrder += 1;
  state.pressedOrder[action] = state.actionOrder;

  if (action==="A") state.isAPressed = true;
  if (action==="S") state.isSPressed = true;
  if (action==="E") state.isEPressed = true;

  if (action==="S" || action==="E") {
    const other = action==="S" ? "E" : "S";
    const otherPressed = other==="S" ? state.isSPressed : state.isEPressed;

    if (otherPressed) {
      state.activeAction =
        state.pressedOrder[action] < state.pressedOrder[other]
        ? action : other;
    } else {
      state.activeAction = action;
    }
  }

  updateButtons();
}

function releaseAction(action) {
  if (!["A","S","E"].includes(action)) return;

  if (action==="A") state.isAPressed = false;
  if (action==="S") state.isSPressed = false;
  if (action==="E") state.isEPressed = false;

  if (action==="S" || action==="E") {
    const candidates = [];
    if (state.isSPressed) candidates.push("S");
    if (state.isEPressed) candidates.push("E");

    if (candidates.length===0) {
      state.activeAction = null;
    } else {
      candidates.sort((a,b)=>state.pressedOrder[a]-state.pressedOrder[b]);
      state.activeAction = candidates[0];
    }
  }

  updateButtons();
}

/* =========================================================
   滑鼠 / 觸控 / Pointer Events
   ========================================================= */
function bindPressTarget(el, action) {
  let pointerActive = false;

  const start = (ev) => {
    /* A/S/E 實體操作按鈕：連 touch 也阻止瀏覽器預設長按選字。
       只作用於區域 3 按鈕，不影響 Canvas 上的雙指縮放。 */
    ev.preventDefault();
    pointerActive = true;
    if (ev.pointerId != null && el.setPointerCapture) {
      try { el.setPointerCapture(ev.pointerId); } catch(e) {}
    }
    pressAction(action);
  };

  const end = (ev) => {
    if (ev.pointerType !== "touch") ev.preventDefault();
    if (!pointerActive) return;
    pointerActive = false;
    releaseAction(action);
  };

  el.addEventListener("pointerdown",start,{passive:false});
  el.addEventListener("pointerup",end,{passive:false});
  el.addEventListener("pointercancel",end,{passive:false});
  el.addEventListener("pointerleave",(ev)=>{
    if (ev.pointerType==="mouse" && pointerActive) {
      pointerActive=false;
      releaseAction(action);
    }
  },{passive:false});
}

actionButtons.forEach(btn=>{
  bindPressTarget(btn,btn.dataset.action);
  /* iPad/Safari: CSS user-select alone may not suppress native long-press selection.
     Region 3 buttons are dedicated controls, so consume touch gestures on the button itself. */
  btn.addEventListener("touchstart", (ev)=>{ ev.preventDefault(); }, {passive:false});
  btn.addEventListener("touchmove",  (ev)=>{ ev.preventDefault(); }, {passive:false});
});

/* 防止平板瀏覽器長按 A/S/E 時啟動文字選取。
   CSS 的 user-select:none 在部分平板瀏覽器/觸控模式下仍可能被長按選取機制繞過，
   因此再用 selectstart + contextmenu 明確攔截按鈕上的文字選取。 */
document.addEventListener("selectstart", (ev)=>{
  if (ev.target.closest && ev.target.closest(".op-btn")) {
    ev.preventDefault();
  }
},{passive:false});

document.addEventListener("contextmenu", (ev)=>{
  if (ev.target.closest && ev.target.closest(".op-btn")) {
    ev.preventDefault();
  }
},{passive:false});


/* =========================================================
   主視圖 / 放大圖中的 A/S/E 圓形按鈕熱區
   ========================================================= */
function hitBadgeOnMain(canvas, ev) {
  const r=canvas.getBoundingClientRect();
  const cssW=r.width, cssH=r.height;
  const scale=Math.min(cssW/1024,cssH/1536);
  const ox=(cssW-1024*scale)/2;
  const oy=(cssH-1536*scale)/2;
  const X=(ev.clientX-r.left-ox)/scale;
  const Y=(ev.clientY-r.top-oy)/scale;

  if ((X-540)**2+(Y-70)**2 <= 35**2) return "A";
  if ((X-540)**2+(Y-390)**2 <= 33**2) return "S";
  if ((X-445)**2+(Y-407)**2 <= 31**2) return "E";
  return null;
}

function hitBadgeOnBulb(canvas, ev) {
  const r=canvas.getBoundingClientRect();
  const w=r.width,h=r.height;
  const baseW=405;
  const scale=Math.min((w*.70)/baseW,(h*.82)/474);
  const actualW=405*scale;
  const actualH=467*scale;
  const x0=(w-actualW)/2-260*scale;
  const y0=(h-actualH)/2-7*scale;
  const X=(ev.clientX-r.left-x0)/scale;
  const Y=(ev.clientY-r.top-y0)/scale;

  if ((X-540)**2+(Y-70)**2 <= 35**2) return "A";
  if ((X-540)**2+(Y-390)**2 <= 33**2) return "S";
  if ((X-445)**2+(Y-407)**2 <= 31**2) return "E";
  return null;
}

function bindCanvasBadge(canvas, hitTest) {
  let active=null;

  const down=(ev)=>{
    if (ev.pointerType !== "touch") ev.preventDefault();
    const action=hitTest(canvas,ev);
    if(!action)return;

    active=action;
    if(canvas.setPointerCapture && ev.pointerId!=null){
      try{canvas.setPointerCapture(ev.pointerId)}catch(e){}
    }
    pressAction(action);
  };

  const up=(ev)=>{
    if (ev.pointerType !== "touch") ev.preventDefault();
    if(!active)return;
    releaseAction(active);
    active=null;
  };

  canvas.addEventListener("pointerdown",down,{passive:false});
  canvas.addEventListener("pointerup",up,{passive:false});
  canvas.addEventListener("pointercancel",up,{passive:false});
  canvas.addEventListener("pointerleave",(ev)=>{
    if(ev.pointerType==="mouse" && active){
      releaseAction(active);
      active=null;
    }
  },{passive:false});
}

bindCanvasBadge(mainCanvas,hitBadgeOnMain);
bindCanvasBadge(bulbCanvas,hitBadgeOnBulb);

/* =========================================================
   鍵盤 A / S / E
   ========================================================= */
window.addEventListener("keydown",(ev)=>{
  const key=ev.key.toUpperCase();
  if(!["A","S","E"].includes(key))return;
  if(ev.repeat)return;
  ev.preventDefault();
  pressAction(key);
});

window.addEventListener("keyup",(ev)=>{
  const key=ev.key.toUpperCase();
  if(!["A","S","E"].includes(key))return;
  ev.preventDefault();
  releaseAction(key);
});

window.addEventListener("blur",()=>{
  ["A","S","E"].forEach(k=>releaseAction(k));
});

/* =========================================================
   每幀更新：deltaTime + requestAnimationFrame
   ========================================================= */
let lastTime = performance.now();

function update(dt) {
  /* A：壓扁吸球，期間體積不變 */
  if (state.isAPressed && !state.isSPressed) {
    state.bulbDeflation += CONFIG.BULB_DEFLATE_RATE * dt;
    state.bulbDeflation = clamp(state.bulbDeflation,0,1);
  }

  /* S：吸液；S/E 同時按住時依先按下者優先 */
  if (state.activeAction==="S" && state.isSPressed) {
    if (state.bulbDeflation > 0) {
      const oldVolume=state.pipetteVolume;
      const dv=Math.min(
        CONFIG.SUCK_RATE*dt,
        CONFIG.MAX_PIPETTE_VOLUME-oldVolume
      );

      state.pipetteVolume += Math.max(0,dv);

      /* dDeflation = -dVolume / 25 */
      state.bulbDeflation -= Math.max(0,dv)/25;
      state.bulbDeflation=clamp(state.bulbDeflation,0,1);
    }
  }

  /* E：排液；吸球狀態完全不變 */
  if (state.activeAction==="E" && state.isEPressed) {
    if (state.pipetteVolume>0) {
      const dv=Math.min(CONFIG.EMPTY_RATE*dt,state.pipetteVolume);
      state.pipetteVolume = Math.max(0,state.pipetteVolume - Math.max(0,dv));
      if(state.pipetteVolume<0.000001)state.pipetteVolume=0;
    }
  }

  /*
    液體守恆。
    pipetteVolume = 0 時，beakerVolume 一定回到 100。
    ⚠ 待確認：若將最大吸量設定到超過 100 mL，這個簡化模型會得到
    負的燒杯體積；目前 MAX_PIPETTE_VOLUME=35，因此不會發生。
  */
  state.beakerVolume=clamp(100-state.pipetteVolume,0,100);

  /* 平滑動畫 */
  state.displayVolume=easeToward(
    state.displayVolume,state.pipetteVolume,CONFIG.VOLUME_SMOOTH,dt
  );
  state.displayBulbDeflation=easeToward(
    state.displayBulbDeflation,state.bulbDeflation,CONFIG.BULB_SMOOTH,dt
  );

  if(Math.abs(state.displayVolume-state.pipetteVolume)<0.0001)
    state.displayVolume=state.pipetteVolume;
  if(Math.abs(state.displayBulbDeflation-state.bulbDeflation)<0.0001)
    state.displayBulbDeflation=state.bulbDeflation;
}

function render() {
  drawMain();
  drawBulbStage();
  updateReadout();
  updateButtons();
}

function frame(now) {
  let dt=(now-lastTime)/1000;
  lastTime=now;
  dt=clamp(dt,0,0.05);

  update(dt);
  render();
  requestAnimationFrame(frame);
}

/* =========================================================
   初始與尺寸變更
   ========================================================= */
function resize() {
  render();
}

window.addEventListener("resize",resize,{passive:true});
window.addEventListener(
  "orientationchange",
  ()=>setTimeout(resize,100),
  {passive:true}
);

render();
requestAnimationFrame(frame);
</script>
</body>
</html>
